labels:
  capability: linux
when:
- event: pull_request
- event: push
- event: manual
steps:
- name: frontend
  image: node:22.23.3-bookworm
  commands:
  - mkdir -p artifacts
  - bash -o pipefail -c 'corepack enable 2>&1 | tee artifacts/frontend-0.log'
  - bash -o pipefail -c 'corepack prepare pnpm@11 --activate 2>&1 | tee artifacts/frontend-1.log'
  - bash -o pipefail -c 'pnpm install --frozen-lockfile 2>&1 | tee artifacts/frontend-2.log'
  - bash -o pipefail -c 'pnpm build 2>&1 | tee artifacts/frontend-3.log'
- name: python-syntax
  image: python:3.13-bookworm
  commands:
  - mkdir -p artifacts
  - bash -o pipefail -c 'python -m compileall -q server scripts research tests 2>&1 | tee artifacts/python-syntax-0.log'
- name: engine-tests
  image: python:3.13-bookworm
  commands:
  - mkdir -p artifacts
  - bash -o pipefail -c 'python -m pip install "numpy>=2.0,<3" "scipy>=1.14,<2" "httpx>=0.27,<1" "beautifulsoup4>=4.12,<5" "pillow>=11,<13" 2>&1 | tee artifacts/engine-tests-0.log'
  - bash -o pipefail -c 'python -m unittest discover -s tests -t . -v 2>&1 | tee artifacts/engine-tests-1.log'
- name: archive-diagnostics
  image: alpine:3.21
  commands:
  - mkdir -p artifacts; tar -czf ci-diagnostics.tgz artifacts
  when:
  - status:
    - success
    - failure
- name: upload-diagnostics
  image: woodpeckerci/plugin-s3@sha256:bf0a088e66b991803e3b9b0401f616245c4d736674195204a7e9e343a871a9ea
  settings:
    bucket:
      from_secret: ci_artifact_bucket
    endpoint:
      from_secret: ci_artifact_endpoint
    access_key:
      from_secret: ci_artifact_access_key
    secret_key:
      from_secret: ci_artifact_secret_key
    source: ci-diagnostics.tgz
    target: fly-estate/${CI_PIPELINE_NUMBER}
    path_style: true
    region: us-east-1
    access: private
  when:
  - status:
    - success
    - failure
