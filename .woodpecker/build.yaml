labels:
  capability: linux
when:
- event: pull_request
- event: push
  branch: main
- event: manual
steps:
- name: frontend
  image: node:22.23.3-bookworm
  commands:
  - corepack enable
  - corepack prepare pnpm@11 --activate
  - pnpm install --frozen-lockfile
  - pnpm build
- name: python-syntax
  image: python:3.13-bookworm
  commands:
  - python -m compileall -q server scripts research tests
- name: engine-tests
  image: python:3.13-bookworm
  commands:
  - python -m pip install "numpy>=2.0,<3" "scipy>=1.14,<2" "httpx>=0.27,<1" "beautifulsoup4>=4.12,<5"
    "pillow>=11,<13"
  - python -m unittest discover -s tests -t . -v
